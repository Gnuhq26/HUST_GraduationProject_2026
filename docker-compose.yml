services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/certs:/app/certs:ro
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    restart: unless-stopped
